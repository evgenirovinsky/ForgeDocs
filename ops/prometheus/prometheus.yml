global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: forgedocs-web-private
    metrics_path: /api/metrics
    scheme: http
    static_configs:
      - targets:
          - "web.railway.internal:8080"
        labels:
          env: production
          service: web

  - job_name: forgedocs-web-public
    metrics_path: /api/metrics
    scheme: https
    static_configs:
      - targets:
          - "web-production-ea5e6.up.railway.app"
        labels:
          env: production
          service: web
          scrape: public
